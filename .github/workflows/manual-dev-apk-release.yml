name: Manual dev APK release

on:
  workflow_dispatch:
  push:
    branches:
      - ci/build-webrtc-aec3-validation-apk

permissions:
  contents: write

concurrency:
  group: medplay-dev-apk-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android platform
        shell: bash
        run: |
          android sdk install platforms/android-37 build-tools/36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Test and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Prepare release files
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MedPlay-debug.apk
          sha256sum MedPlay-debug.apk > MedPlay-debug.sha256

      - name: Replace dev-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete dev-latest --cleanup-tag --yes || true
          git push origin :refs/tags/dev-latest || true
          gh release create dev-latest \
            MedPlay-debug.apk \
            MedPlay-debug.sha256 \
            --target "$GITHUB_SHA" \
            --title "MedPlay development build" \
            --notes "Manual development APK for real-device validation. Debug build; not a production release." \
            --prerelease
