name: REA and JADX smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rea-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify runtime
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          java -version

      - name: Verify REA CLI
        shell: bash
        run: |
          set -euo pipefail
          npx --yes rea-agents@4.1.0 --version
          npx --yes rea-agents@4.1.0 capabilities --json > /tmp/rea-capabilities.json
          node -e 'const x=require("/tmp/rea-capabilities.json"); console.log("REA capabilities JSON parsed successfully"); console.log("Top-level keys:", Object.keys(x).join(", "));'
          npx --yes rea-agents@4.1.0 providers --json > /tmp/rea-providers.json
          node -e 'const x=require("/tmp/rea-providers.json"); console.log("REA providers JSON parsed successfully"); console.log("Top-level keys:", Object.keys(x).join(", "));'

      - name: Install and verify JADX
        shell: bash
        run: |
          set -euo pipefail
          JADX_VERSION="1.5.6"
          curl --fail --location --retry 3             "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip"             --output /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --version

      - name: Security assertion
        shell: bash
        run: |
          set -euo pipefail
          echo "Smoke test only: no APK/APKS, credentials, recordings, or private artifacts were processed."
